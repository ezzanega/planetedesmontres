  <div class="trust-banner__row">
    <div class="trust-banner__item" *ngFor="let item of trustItems">
      <div class="trust-banner__icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" [innerHTML]="item.svgPath"></svg>
      </div>
      <div class="trust-banner__content">
        <h5 class="trust-banner__title">{{ item.title }}</h5>
        <p class="trust-banner__desc">{{ item.desc }}</p>
      </div>
    </div>
  </div>
</div>
<!-- header start -->
<app-header-one [transparent]="true" [white_bg]="true"></app-header-one>
<!-- header end -->

  <!-- breadcrumb start -->
