<header class="site-header">

  <!-- ── Announcement Bar ──────────────────────────────────────── -->
  <div class="announcement-bar">
    <div class="announcement-bar__track">
      <span class="announcement-bar__item"><i class="fas fa-truck"></i> Livraison Gratuite à partir de 700DH</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-phone"></i> +212 6 62 22 18 66</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-shield-alt"></i> 1 an de Garantie</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-truck"></i> Livraison Gratuite à partir de 700DH</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-phone"></i> +212 6 62 22 18 66</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-shield-alt"></i> 1 an de Garantie</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-truck"></i> Livraison Gratuite à partir de 700DH</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-phone"></i> +212 6 62 22 18 66</span>
      <span class="announcement-bar__separator">•</span>
      <span class="announcement-bar__item"><i class="fas fa-shield-alt"></i> 1 an de Garantie</span>
      <span class="announcement-bar__separator">•</span>
    </div>
  </div>

  <!-- ── Main Navbar ───────────────────────────────────────────── -->
  <div id="header-sticky" [ngClass]="[
      'header__area',
      transparent ? 'header__transparent' : '',
      sticky ? 'sticky' : ''
    ]">
    <div [ngClass]="header_big ? 'container-fluid' : 'container'">
      <div class="row align-items-center">

        <!-- Logo -->
        <div [ngClass]="header_big
          ? 'col-xl-2 col-lg-2 col-md-4 col-sm-5 col-6'
          : 'col-xl-3 col-lg-3 col-md-4 col-sm-5 col-6'">
          <!-- <div class="logo">
            <a routerLink="/home">
              <img src="assets/img/logo/logo-8.png" alt="logo" class="logo-img" />
            </a>
          </div> -->
          <div class="logo">
            <a routerLink="/home" class="logo-text">
              <span class="logo-text__main">Planète</span>

              <span class="logo-text__divider">
                <span class="logo-text__line"></span>
                <span class="logo-text__diamond"></span>
                <span class="logo-text__line"></span>
              </span>

              <span class="logo-text__sub">Des Montres</span>
            </a>
          </div>
        </div>

        <!-- Nav -->
        <div [ngClass]="header_big
          ? 'col-xl-7 col-lg-6 col-md-4 col-sm-2 col-2'
          : 'col-xl-6 col-lg-6 col-md-4 col-sm-2 col-2'">
          <div class="main-menu d-none d-lg-block" [ngClass]="{'text-center': header_big}">
            <app-nav-manus></app-nav-manus>
          </div>
        </div>

        <!-- Right actions -->
        <div [ngClass]="header_big
          ? 'col-xl-3 col-lg-4 col-md-4 col-sm-5 col-4'
          : 'col-xl-3 col-lg-3 col-md-4 col-sm-5 col-4'">
          <div class="header__action d-flex align-items-center justify-content-end gap-3">

            <!-- Desktop links -->
            <!-- <ul class="header__action-list d-none d-lg-flex">
              <li>
                <a (click)="utilsService.handleSearchOpen()" class="header__action-btn cursor-pointer">
                  <i class="ion-ios-search-strong"></i>
                </a>
              </li>
              <li>
                <a class="header__action-btn cart cursor-pointer">
                  <i class="ion-bag"></i>
                  <span class="cart-count">{{ cartService.totalPriceQuantity().quantity }}</span>
                </a>
                <app-mini-cart></app-mini-cart>
              </li>
            </ul> -->

            <!-- Mobile hamburger -->
            <a (click)="utilsService.handleOpenMobileMenu()" class="hamburger d-lg-none cursor-pointer"
              aria-label="Open menu">
              <span></span>
              <span></span>
              <span></span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

</header>

<!-- Search Popup -->
<app-search-popup></app-search-popup>

<!-- Mobile Offcanvas -->
<app-offcanvas></app-offcanvas>
